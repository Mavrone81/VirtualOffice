name: Repo hygiene

# Committed-document gate. Fails on any TRACKED file with a document/office extension
# outside the directory allow-list at the repository root.
#
# 🔴 DELIBERATELY ITS OWN WORKFLOW FILE, not a job added to security.yml. security.yml is
# created by a different in-flight PR (the credential-shape gate). Two PRs both creating
# the same workflow file would conflict, and whichever merged second would need a hand
# three-way in a workflow file — which is precisely where a wrong-side resolution can
# delete a gate while every test stays green. Separate files mean the two PRs are
# independent and can merge in either order.
#
# Nothing in this workflow, the script, or the allow-list names the class of document being
# kept out. The extension list carries the meaning and the allow-list names only what is
# permitted. A gate that names what it is protecting tells a reader where to go looking.

on:
  pull_request:
    branches: [main]
  # `push` as well as `pull_request`: a direct push to main skips review, and on this repo
  # a merge to main is a production deploy with no human gate after it. A gate that covers
  # only the reviewed route does not cover the route that needs it most.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repo-hygiene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  committed-documents:
    name: Committed documents
    runs-on: ubuntu-latest
    # No `continue-on-error` at JOB level, now or later. It would also cover the self-test
    # step below, which is the one step whose entire purpose is to prove this scanner is
    # not silently measuring nothing. If a temporary exemption is ever genuinely needed,
    # put it on the scan step only, never on the job.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 🔴 This step must never be exempted from failing the job. It asserts the matcher's
      # shape claims through the real code path — including that an allow-listed directory
      # does NOT cover a sibling sharing its name prefix — and it proves NON-VACUITY by
      # neutralising the allow-list and requiring that the documents this repo legitimately
      # holds still surface. A scanner that walked past every file would pass a file count
      # and fail this.
      - name: Self-test the document scan's shape claims
        run: node .github/scripts/document-file-scan.mjs --self-test

      - name: Scan for committed documents outside the allow-list
        run: |
          set -o pipefail
          # No install: the scanner is dependency-free, stdlib only.
          node .github/scripts/document-file-scan.mjs 2>&1 | tee scan.txt || failed=1
          {
            echo "## Committed documents"
            echo
            if [ "${failed:-0}" = "0" ]; then
              echo "No committed documents outside \`document-file-allowlist.tsv\`."
            else
              echo "A document-extension file is committed outside every allow-listed directory."
              echo
              echo "Fix it by removing the file from the repository. **Prefer that over an"
              echo "allow-list entry** — an exemption is a debt with no due date, and a later"
              echo "reader has to re-judge it forever. If a directory genuinely should hold"
              echo "committed documents, add it to \`document-file-allowlist.tsv\` **with a"
              echo "reason**; entries are directories, never individual filenames."
              echo
              echo "Note that deleting the file from the working tree is not enough if it is"
              echo "already tracked — it has to leave the commit."
            fi
            echo
            echo '```'
            cat scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${failed:-0}"

  owner-name-delta:
    name: Owner name delta
    runs-on: ubuntu-latest
    # No `continue-on-error` at JOB level, now or later — same reason as the job above: it
    # would also cover the self-test, the one step whose purpose is to prove this check is not
    # silently measuring nothing. An exemption, if ever needed, goes on the scan step only.
    #
    # 🔴 WHY THIS JOB EXISTS. "No new code, comment or commit message contains the owner's
    # personal name" is a BLOCKING rule, but nothing enforced it: it surfaced only when a
    # reviewer remembered to run the matcher by hand. In one evening that manual check caught
    # three separate violations and a fourth reached a pushed branch. A category that blocks a
    # merge should not depend on someone remembering to measure it.
    #
    # 🔴 THE PATTERN IS A SECRET, NOT A LITERAL. Committing the name — or a regex spelling it —
    # would put the thing being removed into the check that removes it, in history that is
    # explicitly out of scope for the cleanup. The scanner's output is counts and paths only.
    #
    # 🔴 KNOWN LIMIT: a PR from a FORK receives no secrets, so this job would exit 2 (cannot
    # determine) rather than pass. That is the correct direction — a check that cannot run must
    # not report success — but it means fork PRs need the name checked by hand. All of this
    # project's PRs come from branches in this repository today.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan compares two revisions and walks the commit range between
          # them. A shallow clone would make `rev-list base..head` wrong or empty, and an empty
          # range would report zero message hits for the wrong reason.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 🔴 Never exempt this step. It proves the configured pattern is a valid regex, is not
      # empty or absurdly short (which would match every line), and does NOT match the neutral
      # replacement wording — a pattern that matched "the project owner" would flag every
      # correct fix, and a check that goes red for the wrong reason gets switched off.
      # It also proves the tree walker is non-vacuous against a certainly-present token.
      # STATED LIMIT, in the script's own header: this cannot prove the pattern is the RIGHT
      # name. That failure is silent and is caught only by comparing this job's base count
      # against the team's published matcher record.
      - name: Self-test the owner-name matcher's shape claims
        env:
          OWNER_NAME_PATTERN: ${{ secrets.OWNER_NAME_PATTERN }}
        run: node .github/scripts/owner-name-delta-scan.mjs --self-test

      - name: Scan for added occurrences of the owner's name
        env:
          OWNER_NAME_PATTERN: ${{ secrets.OWNER_NAME_PATTERN }}
          # On a pull_request, compare the PR's base against its head. On a push to main,
          # compare the pushed range. `github.event.before` is all-zeros for a branch's first
          # push, which the scanner rejects as "cannot determine" rather than passing.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          # No install: the scanner is dependency-free, stdlib only.
          node .github/scripts/owner-name-delta-scan.mjs 2>&1 | tee owner-scan.txt || failed=1
          {
            echo "## Owner name delta"
            echo
            if [ "${failed:-0}" = "0" ]; then
              echo "No added occurrences in tracked content, and no commit message in the range carries the name."
            else
              echo "This change adds the owner's personal name to tracked content, to a commit"
              echo "message, or both. The scan below names the files and commits; it deliberately"
              echo "does **not** quote the matched text."
              echo
              echo "Fix it with neutral wording — \"the project owner\", \"owner ruling <date>\" —"
              echo "keeping each comment's meaning. Pre-existing occurrences are a known backlog and"
              echo "are **not** what this gate fails on; it fails on a POSITIVE DELTA only."
              echo
              echo "A commit message cannot be cleaned up later: git history is out of scope for the"
              echo "name removal, so a message hit has to be amended before the branch is merged."
              echo
              echo "Counted in **occurrences**, not files: a file count cannot see a new occurrence"
              echo "inside a file that already contained one."
            fi
            echo
            echo '```'
            cat owner-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${failed:-0}"
